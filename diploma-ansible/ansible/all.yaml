---
- name: Install and configure nginx
  hosts: web_wm
  become: true
  roles:
  - nginx

- name: Install and configure zabbix-agent
  hosts: all
  become: yes    
  roles:
  - zabbix-agent

- name: Install and configure filebeat
  hosts: web_wm
  become: yes
  roles:
  - filebeat

- name: Install and configure ELasticsearch
  hosts: elasticsearch
  become: yes
  roles:
  - elasticsearch

- name: Install and configure kibana
  hosts: kibana
  become: yes
  roles:
  - kibana

- name: Install and configure Zabbix-server
  hosts: zabbix
  become: yes
  roles:
  - zabbix-server

